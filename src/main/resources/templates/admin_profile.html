<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Usuário</title>
    <link rel="stylesheet" th:href="@{/css/admin_profile.css}">
</head>
<body>
<div class="profile-container">
    <div id="navbar">
        <span id="cancelBtn"><a href="/admin/dashboard">Voltar</a></span>
        <span id="editBtn">Editar</span>
    </div>

    <div id="iconCase">
        <img th:if="${user.gender() == user.gender().MASCULINO || user.gender() == user.gender().INTERSEXO}" th:src="@{/images/profile-man-big.png}" class="icon profileIcon" id="profileMan" alt="man profile icon">

        <img th:if="${user.gender() == user.gender().FEMININO}" th:src="@{/images/profile-woman-big.png}" class="icon profileIcon" id="profileWoman" alt="woman profile icon">
    </div>

    <form th:action="@{/admin/dashboard/profile}" method="post" id="profile-form" th:object="${user}">
        <fieldset>
            <legend>Informações Pessoais</legend>
            <div class="form-group">
                <label for="firstName">Nome:</label>
                <input type="text" id="firstName" th:field="*{firstName}" name="firstName" required>
            </div>

            <div class="form-group">
                <label for="lastName">Sobrenome:</label>
                <input type="text" id="lastName" name="lastName" th:field="*{lastName}" required>
            </div>
            <div class="form-group">
                <label for="gender">Sexo Biológico:</label>
                <select id="gender" name="gender" th:field="*{gender}" required>
                    <option th:value="${user.gender().MASCULINO}" th:selected="${user.gender().equals(user.gender().MASCULINO)}">Masculino</option>
                    <option th:value="${user.gender().FEMININO}" th:selected="${user.gender().equals(user.gender().FEMININO)}" >Feminino</option>
                    <option th:value="${user.gender().INTERSEXO}" th:selected="${user.gender().equals(user.gender().INTERSEXO)}">Intersexo</option>
                </select>
            </div>
            <div class="form-group">
                <label for="username">Nome de Usuário:</label>
                <input type="text" id="username" th:field="*{username}" name="username" required>
            </div>

            <div class="form-group">
                <label for="cpf">CPF:</label>
                <input type="text" th:field="*{cpf}" name="cpf" id="cpf">
            </div>

            <div class="form-group">
                <label for="phone">Telefone:</label>
                <input type="text" id="phone" name="phone" th:field="*{phone}" required>
            </div>

            <div class="form-group">
                <label for="birthdate">Data de Nascimento:</label>
                <input type="date" id="birthdate" th:field="*{birthdate}" name="birthdate" required>
            </div>
        </fieldset>

        <fieldset>
            <legend>Endereços</legend>
            <div id="address-list" th:each="address : ${user.addresses()}">
                <div class="form-group">
                    <label>Rua:</label>
                    <input type="text" th:value="${address.street}" disabled>
                </div>
                <div class="form-group">
                    <label for="number">Número</label>
                    <input type="text" th:value="" name="number" id="number" disabled>
                </div>

                <div class="form-group">
                    <label>Cidade:</label>
                    <input type="text" th:value="${address.city}" disabled>
                </div>
                <div class="form-group">
                    <label>Estado:</label>
                    <input type="text" th:value="${address.state}" disabled>
                </div>
                <div class="form-group">
                    <label>CEP:</label>
                    <input type="text" th:value="${address.zip}" disabled>
                </div>
            </div>
        </fieldset>

        <button type="button" id="add-address-btn">+</button>
        <button type="submit" id="saveBtn">Salvar</button>
    </form>
</div>
<script th:src="@{/js/profile.js}"></script>
</body>
</html>
